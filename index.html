<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the app use the whole iPhone screen, including around the notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stride</title>
  <meta name="description" content="Learn AI and tech concepts in short, gamified sessions on your walk.">

  <!-- These lines make the app feel native when added to an iPhone home screen -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stride">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#0f1115">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- The header shows your level, XP, and streak. JavaScript fills it in. -->
  <header id="topbar"></header>

  <!-- Every screen (map, quiz, review...) gets drawn inside <main> by js/app.js -->
  <main id="screen" aria-live="polite"></main>

  <!-- Bottom tab bar -->
  <nav id="tabs">
    <a href="#/learn" data-tab="learn"><span class="tab-icon">🗺️</span>Learn</a>
    <a href="#/review" data-tab="review"><span class="tab-icon">🎯</span>Review</a>
    <a href="#/decode" data-tab="decode"><span class="tab-icon">🔍</span>Decode</a>
    <a href="#/me" data-tab="me"><span class="tab-icon">👤</span>Me</a>
  </nav>

  <!-- type="module" lets our JavaScript files import each other -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
